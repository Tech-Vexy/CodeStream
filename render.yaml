services:
  - type: web
    name: codestream-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build && npm run build:web
    startCommand: npm run start:web
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: codestream
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false
      - key: TEMPORAL_TASK_QUEUE
        value: codestream
      - key: CODESTREAM_API_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: LLM_CONCURRENCY
        value: "2"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENABLED
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  - type: worker
    name: codestream-worker
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: codestream
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false
      - key: TEMPORAL_TASK_QUEUE
        value: codestream
      - key: CODESTREAM_MODEL
        value: google/gemma-4-31b-it
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: JBFqnCBsd6RMkjVDRZzb
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
      - key: LLM_CHUNK_CHARS
        value: "24000"
      - key: LLM_CONCURRENCY
        value: "2"
      - key: CODEBASE_MAX_CHARS
        value: "600000"
      - key: CHANGES_MAX_CHARS
        value: "400000"
      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_EMBEDDING_MODEL
        value: voyage-code-3
      - key: VOYAGE_EMBEDDING_DIMENSIONS
        value: "1024"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENABLED
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
